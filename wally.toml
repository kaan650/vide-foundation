[package]
name = "kaan650/vide-foundation"
version = "0.2.0"
description = "Roblox's Foundation design system for Vide"
license = "MIT"
authors = ["kaan650"]
repository = "https://github.com/kaan650/vide-foundation"
registry = "https://github.com/UpliftGames/wally-index"
realm = "shared"
exclude = ["**"]
include = ["src", "src/**", "default.project.json", "wally.toml", "README.md", "LICENSE"]

[dependencies]
Vide = "centau/vide@0.4.1"
Ripple = "littensy/ripple@0.10.2"

[dev-dependencies]
UILabs = "pepeeltoro41/ui-labs@2.4.2"
